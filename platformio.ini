; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = car

[env]
platform = espressif32
framework = arduino
monitor_speed = 115200
lib_deps = 
	h2zero/NimBLE-Arduino@^2.5.0

; UWB_ANT_DELAY_TX: hieu chuan antenna delay cua Car (mac dinh nha san xuat 16385). Lech chua bu
; do duoc +23 cm va +17 cm o 2 phien (thuoc 2.38 m) -> can giam ~20 cm = +85 don vi (0.235 cm/don vi).
; Da do (cung thuoc 2.38 m): delay 16470 -> phien 160027 lech -3.5 cm, phien 223030 lech +10.9 cm (khac vi tri dat). Thu 16516 = +46 don vi (~-10.9 cm). Con lai / 0.235 = so don vi can chinh them.
; UWB_RAW_STREAM=1 + monitor filter uwb_raw: moi round ghi rieng ra logs/uwb_raw-*.csv, log thuong van gon.
[env:car]
board = esp32-s3-devkitc-1
upload_port = COM10
monitor_port = COM10
monitor_filters = uwb_raw, log2file, default
build_flags = 
	-D IS_CAR=1
	-D UWB_ANT_DELAY_TX=16516
	-D UWB_RAW_STREAM=1
	; Mac dinh 20: Car thuc day (sau khi ngu o che do do thua <1m) de nghe PREPOLL
	; nhung bat nham khung giua round cua Keyfob / khung loi do nhieu RF, phai nghe
	; lai nhieu lan de dong bo. Het 20 lan van chua bat duoc -> ca chu ky do (2.5s)
	; mat trang, distance dung yen. Tang len 40 de kien nhan hon truoc khi bo cuoc.
	-D UWB_PREPOLL_MAX_RESYNC=40
	; Mac dinh 5000 ms/cua so. Giam xuong 1500 de moi lan "khong nhan duoc gi" chi
	; dung im toi da ~3s (2 cua so, UWB_PREPOLL_MAX_RETRY=1) thay vi ~10s, roi thu
	; lai ngay - khong sua duoc NGUYEN NHAN Keyfob ngung phat, chi giam thoi gian
	; dung hinh moi lan thu.
	-D UWB_PREPOLL_LISTEN_TIMEOUT_MS=1500
	-D ARDUINO_USB_MODE=1
	-D ARDUINO_USB_CDC_ON_BOOT=1
build_src_filter = 
	+<shared/>
	+<os/>
	+<crypto/>
	+<protocol/>
	+<uwb/>
	-<uwb/uwb_mock.cpp>
	+<car/>
	+<can/>
	+<nfc/>
	+<lcd/>
	-<keyfob/>
	-<gateway/>
	-<uart/>
lib_deps =
	${env.lib_deps}
	miguelbalboa/MFRC522@^1.4.8
	rweather/Crypto@^0.4.0
	marcoschwartz/LiquidCrystal_I2C@^1.1.4
platform_packages = platformio/tool-scons@^4.41101.0

[env:keyfob]
board = esp32-s3-devkitc-1
upload_port = COM11
monitor_port = COM11
monitor_filters = log2file, default
build_flags = 
	-D IS_KEYFOB=1
	-D ARDUINO_USB_MODE=1
	-D ARDUINO_USB_CDC_ON_BOOT=1
lib_deps = 
	${env.lib_deps}
	bblanchon/ArduinoJson@^7.0.0
	rweather/Crypto@^0.4.0
build_src_filter = 
	+<shared/>
	+<os/>
	+<crypto/>
	+<protocol/>
	+<keyfob/>
	-<can/>
	-<car/>
	-<gateway/>
platform_packages = platformio/tool-scons@^4.41101.0

[env:gateway]
board = esp32-s3-devkitc-1
upload_port = COM7
monitor_port = COM7
monitor_filters = esp32_exception_decoder, log2file, default
build_flags =
	-D IS_GATEWAY=1
	-D ARDUINO_USB_MODE=1
	-D ARDUINO_USB_CDC_ON_BOOT=1
lib_deps =
	mobizt/Firebase Arduino Client Library for ESP8266 and ESP32@^4.4.17
	bblanchon/ArduinoJson@^7.0.0
	ESP32Async/AsyncTCP@3.5.0
	ESP32Async/ESPAsyncWebServer@3.12.1
; Trang cấu hình WiFi: nhúng nguyên file vào firmware (không cần upload filesystem),
; truy cập trong C++ qua ky hieu _binary_web_index_html_start.
board_build.embed_txtfiles = web/index.html
build_src_filter =
	+<shared/>
	+<os/>
	+<cloud/>
	+<gateway/>
	+<can/>
	-<lcd/>
	-<uart/>
	-<car/>
	-<keyfob/>
platform_packages = platformio/tool-scons@^4.41101.0
